# Estado seguro para o primeiro deploy controlado sem dominio/HTTPS.
# A aplicacao continua acessivel apenas por tunel SSH para 127.0.0.1:8080.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    access_log /var/log/nginx/frequenciafacil.access.log;
    error_log /var/log/nginx/frequenciafacil.error.log warn;
    server_tokens off;

    location / {
        return 503;
    }
}
