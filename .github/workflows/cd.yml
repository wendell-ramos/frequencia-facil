name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: SHA completo da main com CI aprovado
        required: true
        type: string
      controlled_deploy:
        description: Digite DEPLOY-CONTROLADO somente apos autorizar o primeiro deploy
        required: true
        type: string

permissions:
  actions: read
  contents: read
  packages: write

concurrency:
  group: frequenciafacil-production
  cancel-in-progress: false

jobs:
  publish-and-deploy:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       vars.ENABLE_PRODUCTION_CD == 'true') ||
      (github.event_name == 'workflow_dispatch' &&
       inputs.controlled_deploy == 'DEPLOY-CONTROLADO')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Selecionar o commit aprovado
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
          MANUAL_SHA: ${{ inputs.commit_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          if [[ "$EVENT_NAME" == workflow_run ]]; then sha="$WORKFLOW_SHA"; else sha="$MANUAL_SHA"; fi
          [[ "$sha" =~ ^[a-f0-9]{40}$ ]]

          main_sha="$(curl --fail --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/main" | jq -r .sha)"
          [[ "$sha" == "$main_sha" ]] || { echo "Deploy obsoleto recusado: o SHA nao e a main atual." >&2; exit 1; }

          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            successes="$(curl --fail --silent --show-error \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=20" \
              | jq --arg sha "$sha" '[.workflow_runs[] | select(.head_sha == $sha)] | length')"
            (( successes > 0 )) || { echo "Nao existe CI push/main aprovado para este SHA." >&2; exit 1; }
          fi

          repository="${GITHUB_REPOSITORY,,}"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tag=ghcr.io/${repository}:sha-${sha}" >> "$GITHUB_OUTPUT"

      - name: Checkout do commit validado pelo CI
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.sha }}
          persist-credentials: false

      - name: Confirmar identidade do checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ steps.release.outputs.sha }}"

      - name: Autenticar no GHCR para publicacao
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir e publicar imagem rastreavel
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: production
          push: true
          tags: ${{ steps.release.outputs.tag }}
          labels: |
            org.opencontainers.image.revision=${{ steps.release.outputs.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Montar referencia imutavel por digest
        id: image
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          repository="${GITHUB_REPOSITORY,,}"
          echo "ref=ghcr.io/${repository}@${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Validar parametros do ambiente de producao
        shell: bash
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PORT: ${{ vars.VPS_SSH_PORT }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          HEALTHCHECK_URL: ${{ vars.HEALTHCHECK_URL }}
        run: |
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$VPS_USER" == ffdeploy ]]
          [[ "$GHCR_USERNAME" =~ ^[A-Za-z0-9_.-]+$ ]]
          [[ "${VPS_SSH_PORT:-22}" == 22 ]]
          [[ "$DEPLOY_PATH" == /opt/frequenciafacil ]]
          [[ "$HEALTHCHECK_URL" == http://127.0.0.1:8080/health ]]

      - name: Preparar SSH com host key fixada
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Validar runner restrito na VPS
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PORT: ${{ vars.VPS_SSH_PORT }}
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -p "${VPS_SSH_PORT:-22}" "$VPS_USER@$VPS_HOST" \
            "test ! -w /usr/local/sbin/frequenciafacil-deploy && sudo -n -l /usr/local/sbin/frequenciafacil-deploy >/dev/null"

      - name: Autenticar a VPS no GHCR sem expor o token
        shell: bash
        env:
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PORT: ${{ vars.VPS_SSH_PORT }}
        run: |
          printf '%s' "$GHCR_READ_TOKEN" | ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -p "${VPS_SSH_PORT:-22}" "$VPS_USER@$VPS_HOST" \
            "sudo -n /usr/local/sbin/frequenciafacil-ghcr-login"

      - name: Atualizar somente o servico da aplicacao
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PORT: ${{ vars.VPS_SSH_PORT }}
          IMAGE: ${{ steps.image.outputs.ref }}
          COMMIT_SHA: ${{ steps.release.outputs.sha }}
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -p "${VPS_SSH_PORT:-22}" "$VPS_USER@$VPS_HOST" \
            "sudo -n /usr/local/sbin/frequenciafacil-deploy '$IMAGE' '$COMMIT_SHA'"

      - name: Remover chave SSH do runner
        if: always()
        run: rm -f "$HOME/.ssh/id_ed25519"
